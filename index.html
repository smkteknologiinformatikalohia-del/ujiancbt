        const CheckIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
        );

        // --- MAIN APP COMPONENT ---
        function App() {
          const [students, setStudents] = useState(() => {
            const saved = localStorage.getItem('cbt_students');
            return saved ? JSON.parse(saved) : DEFAULT_STUDENTS;
          });

          const [questions, setQuestions] = useState(() => {
            const saved = localStorage.getItem('cbt_questions');
            return saved ? JSON.parse(saved) : DEFAULT_QUESTIONS;
          });

          const [schoolName, setSchoolName] = useState(() => {
            return localStorage.getItem('cbt_school_name') || 'SMK SWASTA TEKNOLOGI INFORMATIKA LOHIA';
          });

          const [examDuration, setExamDuration] = useState(() => {
            return parseInt(localStorage.getItem('cbt_exam_duration')) || 30; 
          });

          const [examDate, setExamDate] = useState(() => {
            const today = new Date().toISOString().split('T')[0];
            return localStorage.getItem('cbt_exam_date') || today;
          });

          const [isExamGateOpen, setIsExamGateOpen] = useState(() => {
            const saved = localStorage.getItem('cbt_exam_gate');
            return saved !== null ? JSON.parse(saved) : true; 
          });

          const [tokenType, setTokenType] = useState(() => {
            return localStorage.getItem('cbt_token_type') || 'random'; 
          });

          const [staticTokenValue, setStaticTokenValue] = useState(() => {
            return localStorage.getItem('cbt_static_token_value') || 'ANB26';
          });

          const [subjects, setSubjects] = useState(() => {
            const saved = localStorage.getItem('cbt_subjects');
            return saved ? JSON.parse(saved) : DEFAULT_SUBJECTS;
          });

          const [sessionSettings, setSessionSettings] = useState(() => {
            const saved = localStorage.getItem('cbt_sessions');
            return saved ? JSON.parse(saved) : DEFAULT_SESSION_SETTINGS;
          });

          const [examResults, setExamResults] = useState(() => {
            const saved = localStorage.getItem('cbt_exam_results');
            return saved ? JSON.parse(saved) : DEFAULT_EXAM_RESULTS;
          });

          // --- VIEW STATE ---
          const [currentUser, setCurrentUser] = useState(null); 
          const [currentTab, setCurrentTab] = useState('login'); 

          // --- LOGIN STATES ---
          const [usernameInput, setUsernameInput] = useState('');
          const [passwordInput, setPasswordInput] = useState('');
          const [showPassword, setShowPassword] = useState(false);
          const [loginError, setLoginError] = useState('');

          // --- CONFIRMATION STATES ---
          const [genderInput, setGenderInput] = useState('Laki-laki');
          const [subjectInput, setSubjectInput] = useState('');
          const [birthDateInput, setBirthDateInput] = useState('');
          const [tokenInput, setTokenInput] = useState('');
          const [generatedToken, setGeneratedToken] = useState('ANB26');
          const [confirmationError, setConfirmationError] = useState('');

          // --- TEST ENGINE STATES ---
          const [activeQuestionIndex, setActiveQuestionIndex] = useState(0);
          const [answers, setAnswers] = useState({}); 
          const [flaggedQuestions, setFlaggedQuestions] = useState({}); 
          const [timeLeft, setTimeLeft] = useState(1800); 
          const [testStarted, setTestStarted] = useState(false);
          const [showConfirmSubmit, setShowConfirmSubmit] = useState(false);

          // --- PORTAL ADMIN STATES ---
          const [adminActiveMenu, setAdminActiveMenu] = useState('soal'); 
          const [selectedStudentForCard, setSelectedStudentForCard] = useState(null); 
          const [isBulkPrinting, setIsBulkPrinting] = useState(false); 
          
          const [selectedResultDetail, setSelectedResultDetail] = useState(null);
          const [tempEssayScoreInput, setTempEssayScoreInput] = useState('');
          const [resultSearchQuery, setResultSearchQuery] = useState('');
          const [resultFilterSubject, setResultFilterSubject] = useState('semua');
          
          const [newType, setNewType] = useState('pg');
          const [newQuestionText, setNewQuestionText] = useState('');
          const [newOptions, setNewOptions] = useState(['', '', '', '', '']); 
          const [newCorrectAnswerPG, setNewCorrectAnswerPG] = useState('');
          const [newCorrectAnswerPGK, setNewCorrectAnswerPGK] = useState([]);
          const [newPairs, setNewPairs] = useState([
            { prompt: '', response: '' },
            { prompt: '', response: '' }
          ]);
          const [newMatchOptions, setNewMatchOptions] = useState('');
          const [newCorrectIsian, setNewCorrectIsian] = useState('');

          const [newStudName, setNewStudName] = useState('');
          const [newStudClass, setNewStudClass] = useState('');
          const [newStudMajor, setNewStudMajor] = useState('');
          const [newStudBirthDate, setNewStudBirthDate] = useState('');
          const [newStudSession, setNewStudSession] = useState('1'); 
          const [newStudUsername, setNewStudUsername] = useState('');
          const [newStudPassword, setNewStudPassword] = useState('');
          const [newStudPhoto, setNewStudPhoto] = useState('');

          const [newSubjName, setNewSubjName] = useState('');
          const [newSubjCode, setNewSubjCode] = useState('');

          // ==========================================
          // EFFECTS SINKRONISASI KE LOCALSTORAGE
          // ==========================================
          useEffect(() => {
            localStorage.setItem('cbt_students', JSON.stringify(students));
          }, [students]);

          useEffect(() => {
            localStorage.setItem('cbt_questions', JSON.stringify(questions));
          }, [questions]);

          useEffect(() => {
            localStorage.setItem('cbt_subjects', JSON.stringify(subjects));
          }, [subjects]);

          useEffect(() => {
            localStorage.setItem('cbt_sessions', JSON.stringify(sessionSettings));
          }, [sessionSettings]);

          useEffect(() => {
            localStorage.setItem('cbt_exam_results', JSON.stringify(examResults));
          }, [examResults]);

          useEffect(() => {
            localStorage.setItem('cbt_school_name', schoolName);
          }, [schoolName]);

          useEffect(() => {
            localStorage.setItem('cbt_exam_duration', examDuration.toString());
          }, [examDuration]);

          useEffect(() => {
            localStorage.setItem('cbt_exam_date', examDate);
          }, [examDate]);

          useEffect(() => {
            localStorage.setItem('cbt_exam_gate', JSON.stringify(isExamGateOpen));
          }, [isExamGateOpen]);

          useEffect(() => {
            localStorage.setItem('cbt_token_type', tokenType);
          }, [tokenType]);

          useEffect(() => {
            localStorage.setItem('cbt_static_token_value', staticTokenValue);
          }, [staticTokenValue]);

          useEffect(() => {
            if (subjects.length > 0 && !subjectInput) {
              setSubjectInput(subjects[0].name);
            }
          }, [subjects]);

          useEffect(() => {
            if (currentTab === 'student_confirmation' && currentUser?.role === 'student') {
              if (tokenType === 'random') {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let result = '';
                for (let i = 0; i < 5; i++) {
                  result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                setGeneratedToken(result);
              } else {
                setGeneratedToken(staticTokenValue.trim().toUpperCase());
              }
              setTokenInput('');
              setConfirmationError('');
              setBirthDateInput(currentUser.data.tanggalLahir || '');
            }
          }, [currentTab, tokenType, staticTokenValue]);

          useEffect(() => {
            let timer;
            if (testStarted && timeLeft > 0) {
              timer = setInterval(() => {
                setTimeLeft(prev => {
                  if (prev <= 1) {
                    clearInterval(timer);
                    handleSubmitTest(); 
                    return 0;
                  }
                  return prev - 1;
                });
              }, 1000);
            }
            return () => clearInterval(timer);
          }, [testStarted, timeLeft]);

          // --- HANDLERS ---
          const handleLogin = (e) => {
            e.preventDefault();
            setLoginError('');

            if (!usernameInput || !passwordInput) {
              setLoginError('Harap isi semua kolom!');
              return;
            }

            if (usernameInput.toLowerCase() === 'admin' && passwordInput === 'admin') {
              setCurrentUser({ role: 'admin', name: 'Administrator' });
              setCurrentTab('admin_dashboard');
              return;
            }

            if (!isExamGateOpen) {
              setLoginError('Akses Masuk Ujian Sedang Ditutup Sementara oleh Administrator!');
              return;
            }

            const student = students.find(
              s => s.username.toLowerCase() === usernameInput.toLowerCase() && s.password === passwordInput
            );

            if (student) {
              const studentSession = student.sesi || "1";
              const isSessionActive = sessionSettings[studentSession]?.isActive;
              
              if (!isSessionActive) {
                setLoginError(`Maaf, Ujian Sesi Anda (${sessionSettings[studentSession]?.name || 'Tidak Diketahui'}) belum aktif atau telah ditutup proktor.`);
                return;
              }

              setCurrentUser({ role: 'student', data: student });
              setCurrentTab('student_confirmation'); 
            } else {
              setLoginError('Username atau Password salah!');
            }
          };

          const handleLogout = () => {
            setCurrentUser(null);
            setCurrentTab('login');
            setUsernameInput('');
            setPasswordInput('');
            setShowPassword(false);
            setTestStarted(false);
            setAnswers({});
            setFlaggedQuestions({});
          };

          const handleConfirmStudentData = (e) => {
            e.preventDefault();
            setConfirmationError('');

            if (!birthDateInput) {
              setConfirmationError('Harap lengkapi Tanggal Lahir Anda!');
              return;
            }

            if (!tokenInput) {
              setConfirmationError('Harap masukkan Token Ujian!');
              return;
            }

            if (birthDateInput !== currentUser.data.tanggalLahir) {
              setConfirmationError('Tanggal Lahir yang Anda masukkan tidak sesuai dengan database!');
              return;
            }

            if (tokenInput.trim().toUpperCase() !== generatedToken) {
              setConfirmationError('Token Ujian yang Anda masukkan salah / tidak valid!');
              return;
            }

            setCurrentTab('student_dashboard');
          };

          const startTest = () => {
            setAnswers({});
            setFlaggedQuestions({});
            setTimeLeft(examDuration * 60); 
            setActiveQuestionIndex(0);
            setTestStarted(true);
            setCurrentTab('test_screen');
          };

          // FUNGSI UNTUK MEMBENTUK FORMAT WAKTU (TIMER)
          const formatTime = (seconds) => {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          };

          const handleSelectAnswer = (qId, value, isPGK = false) => {
            if (isPGK) {
              const currentSelection = answers[qId] || [];
              if (currentSelection.includes(value)) {
                setAnswers({
                  ...answers,
                  [qId]: currentSelection.filter(item => item !== value)
                });
              } else {
                setAnswers({
                  ...answers,
                  [qId]: [...currentSelection, value]
                });
              }
            } else {
              setAnswers({
                ...answers,
                [qId]: value
              });
            }
          };

          const handleMatchAnswer = (qId, promptIndex, selectedResponse) => {
            const currentMatches = answers[qId] || {};
            setAnswers({
              ...answers,
              [qId]: {
                ...currentMatches,
                [promptIndex]: selectedResponse
              }
            });
          };

          const toggleFlagged = (qId) => {
            setFlaggedQuestions({
              ...flaggedQuestions,
              [qId]: !flaggedQuestions[qId]
            });
          };

          const handleSubmitTest = () => {
            setTestStarted(false);
            
            let correctCount = 0;
            const gradableQuestions = questions.filter(q => q.type !== 'essay');
            const hasEssay = questions.some(q => q.type === 'essay');

            gradableQuestions.forEach(q => {
              const studentAns = answers[q.id];
              if (!studentAns) return;

              if (q.type === 'pg') {
                if (studentAns === q.correctAnswer) correctCount++;
              } else if (q.type === 'pgk') {
                const correctSet = new Set(q.correctAnswer);
                const studentSet = new Set(studentAns || []);
                if (correctSet.size === studentSet.size && [...correctSet].every(x => studentSet.has(x))) {
                  correctCount++;
                }
              } else if (q.type === 'menjodohkan') {
                let allPairsCorrect = true;
                q.pairs.forEach((pair, idx) => {
                  if (studentAns[idx] !== pair.response) {
                    allPairsCorrect = false;
                  }
                });
                if (allPairsCorrect) correctCount++;
              } else if (q.type === 'isian') {
                if (studentAns.trim().toLowerCase() === q.correctAnswer.trim().toLowerCase()) {
                  correctCount++;
                }
              }
            });

            const autoScore = gradableQuestions.length > 0 
              ? Math.round((correctCount / gradableQuestions.length) * 100) 
              : 100;

            const calculatedFinalScore = hasEssay 
              ? Math.round(autoScore * 0.8) 
              : autoScore;

            const newResult = {
              id: "res_" + Date.now(),
              studentId: currentUser.data.id,
              studentName: currentUser.data.name,
              kelas: currentUser.data.kelas,
              jurusan: currentUser.data.jurusan,
              sesi: currentUser.data.sesi || "1",
              subject: subjectInput,
              subjectCode: getSelectedSubjectCode(),
              autoScore: autoScore,
              essayScore: null, 
              finalScore: calculatedFinalScore,
              completedAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
              status: hasEssay ? "Perlu Diperiksa" : "Selesai",
              answers: { ...answers }
            };

            const updatedResults = [newResult, ...examResults.filter(r => !(r.studentId === currentUser.data.id && r.subject === subjectInput))];
            setExamResults(updatedResults);

            setCurrentTab('result_screen');
          };

          const resetAllData = () => {
            const confirmReset = window.confirm("Apakah Anda yakin ingin menyetel ulang semua data bank soal, sesi, siswa, dan hasil ujian ke pengaturan semula?");
            if (confirmReset) {
              setStudents(DEFAULT_STUDENTS);
              setQuestions(DEFAULT_QUESTIONS);
              setSubjects(DEFAULT_SUBJECTS);
              setSessionSettings(DEFAULT_SESSION_SETTINGS);
              setExamResults(DEFAULT_EXAM_RESULTS);
              setSchoolName('SMK SWASTA TEKNOLOGI INFORMATIKA LOHIA');
              setExamDuration(30);
              setExamDate(new Date().toISOString().split('T')[0]);
              setIsExamGateOpen(true);
              setTokenType('random');
              setStaticTokenValue('ANB26');

              localStorage.removeItem('cbt_students');
              localStorage.removeItem('cbt_questions');
              localStorage.removeItem('cbt_subjects');
              localStorage.removeItem('cbt_sessions');
              localStorage.removeItem('cbt_exam_results');
              localStorage.removeItem('cbt_school_name');
              localStorage.removeItem('cbt_exam_duration');
              localStorage.removeItem('cbt_exam_date');
              localStorage.removeItem('cbt_exam_gate');
              localStorage.removeItem('cbt_token_type');
              localStorage.removeItem('cbt_static_token_value');

              window.alert("Data CBT berhasil disetel ulang ke kondisi semula!");
            }
          };

          const formatIndonesianDate = (dateString) => {
            if (!dateString) return "-";
            const months = [
              "Januari", "Februari", "Maret", "April", "Mei", "Juni",
              "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ];
            try {
              const parts = dateString.split("-");
              if (parts.length !== 3) return dateString;
              const year = parts[0];
              const monthIndex = parseInt(parts[1], 10) - 1;
              const day = parseInt(parts[2], 10);
              return `${day} ${months[monthIndex]} ${year}`;
            } catch (e) {
              return dateString;
            }
          };

          const handleAddQuestion = (e) => {
            e.preventDefault();
            if (!newQuestionText.trim()) {
              alert("Pertanyaan wajib diisi!");
              return;
            }

            let itemToSave = {
              id: "q_" + Date.now(),
              type: newType,
              question: newQuestionText
            };

            if (newType === 'pg') {
              if (!newCorrectAnswerPG) {
                alert("Pilih satu kunci jawaban yang benar!");
                return;
              }
              itemToSave.options = newOptions.filter(o => o.trim() !== "");
              itemToSave.correctAnswer = newCorrectAnswerPG;
            } else if (newType === 'pgk') {
              if (newCorrectAnswerPGK.length === 0) {
                alert("Pilih minimal satu kunci jawaban untuk Pilihan Ganda Kompleks!");
                return;
              }
              itemToSave.options = newOptions.filter(o => o.trim() !== "");
              itemToSave.correctAnswer = newCorrectAnswerPGK;
            } else if (newType === 'menjodohkan') {
              const validPairs = newPairs.filter(p => p.prompt.trim() !== "" && p.response.trim() !== "");
              if (validPairs.length === 0) {
                alert("Isi minimal satu pasangan penjodohan!");
                return;
              }
              itemToSave.pairs = validPairs;
              const listOpts = validPairs.map(p => p.response);
              if (newMatchOptions.trim()) {
                const extra = newMatchOptions.split(',').map(x => x.trim()).filter(Boolean);
                listOpts.push(...extra);
              }
              itemToSave.matchOptions = Array.from(new Set(listOpts));
            } else if (newType === 'isian') {
              if (!newCorrectIsian.trim()) {
                alert("Masukkan kunci jawaban isian singkat!");
                return;
              }
              itemToSave.correctAnswer = newCorrectIsian.trim();
            }

            setQuestions([...questions, itemToSave]);
            setNewQuestionText('');
            setNewOptions(['', '', '', '', '']); 
            setNewCorrectAnswerPG('');
            setNewCorrectAnswerPGK([]);
            setNewPairs([{ prompt: '', response: '' }, { prompt: '', response: '' }]);
            setNewMatchOptions('');
            setNewCorrectIsian('');
            alert("Pertanyaan berhasil disimpan di Bank Soal!");
          };

          const handleDeleteQuestion = (id) => {
            if (confirm("Hapus soal ini secara permanen?")) {
              setQuestions(questions.filter(q => q.id !== id));
            }
          };

          const handleAddStudent = (e) => {
            e.preventDefault();
            if (!newStudName || !newStudUsername || !newStudPassword) {
              alert("Nama, Username, dan Password wajib diisi!");
              return;
            }

            const newStudent = {
              id: "std_" + Date.now(),
              name: newStudName,
              kelas: newStudClass || "XII",
              jurusan: newStudMajor || "Lainnya",
              tanggalLahir: newStudBirthDate || "2008-01-01",
              sesi: newStudSession, 
              username: newStudUsername.trim().toLowerCase(),
              password: newStudPassword,
              photo: newStudPhoto.trim() || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"
            };

            if (students.some(s => s.username === newStudent.username)) {
              alert("Username sudah digunakan!");
              return;
            }

            setStudents([...students, newStudent]);
            setNewStudName('');
            setNewStudClass('');
            setNewStudMajor('');
            setNewStudBirthDate('');
            setNewStudSession('1');
            setNewStudUsername('');
            setNewStudPassword('');
            setNewStudPhoto('');
            alert("Data siswa berhasil ditambahkan dan tersimpan permanen!");
          };

          const handleDeleteStudent = (id) => {
            if (confirm("Hapus data siswa ini?")) {
              setStudents(students.filter(s => s.id !== id));
            }
          };

          const handleAddSubject = (e) => {
            e.preventDefault();
            if (!newSubjName.trim() || !newSubjCode.trim()) {
              alert("Harap isi nama mata ujian dan kode soal!");
              return;
            }
            const isDuplicate = subjects.some(s => s.name.toLowerCase() === newSubjName.trim().toLowerCase() || s.code.toLowerCase() === newSubjCode.trim().toLowerCase());
            if (isDuplicate) {
              alert("Mata ujian atau kode soal sudah terdaftar!");
              return;
            }
            const added = [...subjects, { name: newSubjName.trim(), code: newSubjCode.trim().toUpperCase() }];
            setSubjects(added);
            setNewSubjName('');
            setNewSubjCode('');
            alert("Mata ujian berhasil ditambahkan!");
          };

          const handleDeleteSubject = (index) => {
            if (subjects.length <= 1) {
              alert("Harus ada minimal satu mata ujian terdaftar!");
              return;
            }
            if (confirm("Hapus mata ujian ini?")) {
              const updated = subjects.filter((_, i) => i !== index);
              setSubjects(updated);
              setSubjectInput(updated[0].name);
            }
          };

          const handleUpdateSessionTime = (key, field, value) => {
            const updated = {
              ...sessionSettings,
              [key]: {
                ...sessionSettings[key],
                [field]: value
              }
            };
            setSessionSettings(updated);
          };

          const handleSaveEssayScore = (e) => {
            e.preventDefault();
            const parsedScore = parseInt(tempEssayScoreInput);
            if (isNaN(parsedScore) || parsedScore < 0 || parsedScore > 100) {
              alert("Harap masukkan nilai essay yang valid antara rentang 0 s/d 100!");
              return;

                                type="number"
                                min={0}
                                max={100}
                                required
                                className="w-full p-2 border border-slate-300 rounded-lg text-center font-bold text-md text-emerald-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="Masukkan skor..."
                                value={tempEssayScoreInput}
                                onChange={(e) => setTempEssayScoreInput(e.target.value)}
                              />
                            </div>

                            <button
                              type="submit"
                              className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-xs transition uppercase flex items-center justify-center space-x-1"
                            >
                              <CheckIcon className="w-4 h-4" />
                              <span>Simpan & Akumulasi</span>
                            </button>
                          </form>
                        </div>

                        <div className="text-[10px] text-slate-400 mt-4 leading-normal bg-white p-2 rounded border">
                          <strong>Catatan Nilai Akhir:</strong><br />
                          Rumus kelulusan ANBK dihitung berdasarkan bobot <strong>80% skor pilihan otomatis</strong> ditambah <strong>20% skor essay proktor</strong>.
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* AREA PRINT REKAP NILAI (AKTIF SAAT BROWSER PRINT) */}
              <div className="hidden print-area p-8 bg-white text-black font-sans">
                <div className="text-center border-b-2 border-black pb-4 mb-6">
                  <h2 className="text-xl font-extrabold uppercase">LAPORAN REKAPITULASI HASIL & NILAI UJIAN CBT ANBK</h2>
                  <p className="text-sm font-bold uppercase mt-1">{schoolName}</p>
                  <p className="text-xs text-slate-500 mt-0.5">Tanggal Pelaksanaan: {formatIndonesianDate(examDate)}</p>
                </div>

                <table className="w-full text-left text-xs border border-collapse border-black">
                  <thead>
                    <tr className="bg-slate-100 uppercase font-bold border-b border-black">
                      <th className="p-2 border border-black">Nama Siswa</th>
                      <th className="p-2 border border-black">Kelas & Jurusan</th>
                      <th className="p-2 border border-black text-center">Sesi</th>
                      <th className="p-2 border border-black">Mata Ujian</th>
                      <th className="p-2 border border-black text-center">Skor Pilihan</th>
                      <th className="p-2 border border-black text-center">Skor Essay</th>
                      <th className="p-2 border border-black text-center">Nilai Akhir</th>
                      <th className="p-2 border border-black">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {getFilteredResults().map((res, index) => (
                      <tr key={index} className="border-b border-black">
                        <td className="p-2 border border-black font-bold">{res.studentName}</td>
                        <td className="p-2 border border-black">{res.kelas} • {res.jurusan}</td>
                        <td className="p-2 border border-black text-center">Sesi {res.sesi}</td>
                        <td className="p-2 border border-black">{res.subject}</td>
                        <td className="p-2 border border-black text-center font-bold">{res.autoScore}</td>
                        <td className="p-2 border border-black text-center font-bold">{res.essayScore !== null ? res.essayScore : "-"}</td>
                        <td className="p-2 border border-black text-center font-extrabold text-sm">{res.finalScore}</td>
                        <td className="p-2 border border-black font-bold">{res.status}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>

                <div className="mt-12 flex justify-end">
                  <div className="text-center w-64 text-xs">
                    <p>Lohia, {new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                    <p className="font-bold mt-1">Kepala Sekolah / Panitia CBT,</p>
                    <div className="h-16"></div>
                    <p className="font-bold underline">Administrator Proktor CBT</p>
                    <p className="text-[10px] text-slate-500">NIP. ————————————————</p>
                  </div>
                </div>
              </div>

              {/* AREA PRINT KARTU UJIAN */}
              <div className="hidden print-area p-8 bg-white text-black">
                {isBulkPrinting ? (
                  <div className="grid grid-cols-2 gap-6">
                    {students.map((std) => (
                      <div key={std.id} className="print-card-box border-2 border-black p-4 rounded bg-white relative">
                        <div className="absolute top-0 left-0 right-0 h-1 bg-black"></div>
                        <div className="flex items-center space-x-2 border-b-2 border-black pb-2 mb-3">
                          <div className="w-8 h-8 border border-black flex items-center justify-center font-bold text-xs">CBT</div>
                          <div className="flex-1 leading-none text-left">
                            <h5 className="font-extrabold text-[10px] uppercase">KARTU PESERTA UJIAN CBT ANBK</h5>
                            <p className="text-[8px] font-bold uppercase mt-1 text-slate-700">{schoolName}</p>
                          </div>
                        </div>

                        <div className="grid grid-cols-12 gap-2 text-[10px] items-start text-left">
                          <div className="col-span-8 space-y-1">
                            <div className="grid grid-cols-3">
                              <span className="font-semibold">Nama</span>
                              <span className="col-span-2 font-bold">: {std.name}</span>
                            </div>
                            <div className="grid grid-cols-3">
                              <span className="font-semibold">Jurusan</span>
                              <span className="col-span-2">: {std.jurusan}</span>
                            </div>
                            <div className="grid grid-cols-3">
                              <span className="font-semibold">Tgl Ujian</span>
                              <span className="col-span-2">: {formatIndonesianDate(examDate)}</span>
                            </div>
                            <div className="grid grid-cols-3">
                              <span className="font-semibold">Sesi</span>
                              <span className="col-span-2 font-bold text-emerald-800">: Sesi {std.sesi || "1"}</span>
                            </div>
                            <div className="grid grid-cols-3 border-t border-dashed border-slate-400 pt-1 mt-1">
                              <span className="font-semibold">Username</span>
                              <span className="col-span-2 font-mono font-bold text-indigo-700">: {std.username}</span>
                            </div>
                            <div className="grid grid-cols-3">
                              <span className="font-semibold">Password</span>
                              <span className="col-span-2 font-mono font-bold">: {std.password}</span>
                            </div>
                          </div>

                          <div className="col-span-4 flex flex-col items-center justify-between space-y-2">
                            <img
                              src={std.photo}
                              alt="Foto"
                              className="w-14 h-16 object-cover border border-slate-400 rounded"
                              onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200" }}
                            />
                            <div className="text-center text-[7px] leading-tight w-full">
                              <p className="font-bold">Panitia CBT</p>
                              <p className="font-semibold text-slate-500">CBT Admin</p>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  selectedStudentForCard && (
                    <div className="max-w-md mx-auto print-card-box border-2 border-black p-5 rounded bg-white relative">
                      <div className="absolute top-0 left-0 right-0 h-1 bg-black"></div>
                      <div className="flex items-center space-x-3 border-b-2 border-black pb-2 mb-4">
                        <div className="w-10 h-10 border-2 border-black flex items-center justify-center font-extrabold text-xs">CBT</div>
                        <div className="flex-1 leading-none text-left">
                          <h5 className="font-extrabold text-xs tracking-wider uppercase">KARTU PESERTA UJIAN CBT ANBK</h5>
                          <p className="text-[10px] font-bold uppercase mt-1 text-slate-700">{schoolName}</p>
                        </div>
                      </div>

                      <div className="grid grid-cols-12 gap-3 text-[11px] items-start text-left">
                        <div className="col-span-8 space-y-1.5">
                          <div className="grid grid-cols-3">
                            <span className="font-semibold">Nama</span>
                            <span className="col-span-2 font-bold text-slate-900">: {selectedStudentForCard.name}</span>
                          </div>
                          <div className="grid grid-cols-3">
                            <span className="font-semibold">Jurusan</span>
                            <span className="col-span-2">: {selectedStudentForCard.jurusan}</span>
                          </div>
                          <div className="grid grid-cols-3">
                            <span className="font-semibold">Tgl Ujian</span>
                            <span className="col-span-2 font-bold text-slate-800">: {formatIndonesianDate(examDate)}</span>
                          </div>
                          <div className="grid grid-cols-3">
                            <span className="font-semibold">Tgl Lahir</span>
                            <span className="col-span-2">: {selectedStudentForCard.tanggalLahir}</span>
                          </div>
                          <div className="grid grid-cols-3">
                            <span className="font-semibold">Sesi</span>
                            <span className="col-span-2 font-bold text-emerald-800">: Sesi {selectedStudentForCard.sesi || "1"} ({sessionSettings[selectedStudentForCard.sesi || "1"]?.name})</span>
                          </div>
                          <div className="grid grid-cols-3 border-t border-dashed border-slate-400 pt-1.5 mt-1.5">
                            <span className="font-semibold">Username</span>
                            <span className="col-span-2 font-mono font-bold text-indigo-700">: {selectedStudentForCard.username}</span>
                          </div>
                          <div className="grid grid-cols-3">
                            <span className="font-semibold">Password</span>
                            <span className="col-span-2 font-mono font-bold">: {selectedStudentForCard.password}</span>
                          </div>
                        </div>

                        <div className="col-span-4 flex flex-col items-center justify-between space-y-4">
                          <img
                            src={selectedStudentForCard.photo}
                            alt="Foto"
                            className="w-18 h-22 object-cover border border-slate-400 rounded"
                            onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200" }}
                          />
                          <div className="text-center text-[8px] leading-tight w-full">
                            <p className="font-bold">Panitia CBT</p>
                            <p className="font-semibold text-slate-500">CBT Admin</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  )
                )}
              </div>

            </div>
          );
        }

        // render React App ke DOM root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
